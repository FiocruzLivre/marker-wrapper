services:
  marker:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    restart: unless-stopped
    mem_limit: 320m
    pids_limit: 64
    read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - 'php -r "exit(@fsockopen(''127.0.0.1'', 9000) ? 0 : 1);"'
      interval: 5s
      timeout: 2s
      start_period: 10s
      retries: 12
    tmpfs:
      - /tmp:mode=1777,size=32m
    environment:
      TILE_SERVER: ${TILE_SERVER:?Set an approved HTTPS XYZ tile origin}
      MARKER_USER_AGENT: ${MARKER_USER_AGENT:?Set an identifiable user agent with contact information}
      MARKER_REFERER: ${MARKER_REFERER:-}
      CACHE_DIR: /app/cache
      TILE_CACHE_TTL: ${TILE_CACHE_TTL:-604800}
      STATIC_CACHE_TTL: ${STATIC_CACHE_TTL:-86400}
      MARKER_CACHE_TTL: ${MARKER_CACHE_TTL:-2592000}
    volumes:
      - tile-cache:/app/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  nginx:
    image: nginxinc/nginx-unprivileged:1.30.0-alpine
    restart: unless-stopped
    mem_limit: 64m
    pids_limit: 64
    depends_on:
      marker:
        condition: service_healthy
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/run
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  tile-cache:
