version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: composer
    directory: /vendor-bin/phpunit
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /vendor-bin/psalm
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /vendor-bin/coding-standard
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /.docker/php
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
