version: 2

updates:
  # Runtime dependencies and isolated developer tools.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: composer
    directory: /vendor-bin/phpunit
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /vendor-bin/psalm
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /vendor-bin/coding-standard
    schedule:
      interval: weekly

  # PHP base image defined in the nested Dockerfile.
  - package-ecosystem: docker
    directory: /.docker/php
    schedule:
      interval: weekly

  # Nginx image used by the root Compose file.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Maki SVG icons are tracked as a Git submodule.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
